name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The gate: generated/ must be what the source produces. A hand-edited
      # artifact — on either side of the contract — cannot reach main.
      - run: node tools/generate.mjs --check

